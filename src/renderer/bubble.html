<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clippie</title>
    <style>
      :root {
        --bg: #fffdf5;
        --surface: #ffffff;
        --border: #e5dec9;
        --text: #1c1917;
        --muted: #6b665c;
        --accent: #1d4ed8;
        --accent-hover: #1e40af;
        --warn-bg: #fef3c7;
        --warn-text: #92400e;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        margin: 0;
        padding: 6px;
        color: var(--text);
        user-select: none;
      }
      .bubble {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        max-width: 348px;
        box-shadow: 0 10px 28px rgba(28, 25, 23, 0.14), 0 2px 6px rgba(28, 25, 23, 0.06);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .clip-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--muted);
        background: #f3efe2;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .classic-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
      }
      .classic-pill input {
        margin: 0;
        cursor: pointer;
      }
      .classic-banner {
        font-style: italic;
        font-size: 12px;
        margin: 0 0 6px;
        color: #44403c;
      }
      .rationale {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        margin: 0 0 8px;
      }
      .artifact-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 11px;
        font-size: 13px;
        line-height: 1.48;
        color: var(--text);
        max-height: 124px;
        overflow-y: auto;
        white-space: pre-wrap;
        user-select: text;
      }
      .degradation {
        background: var(--warn-bg);
        color: var(--warn-text);
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 11.5px;
        line-height: 1.35;
        margin: 8px 0 0;
      }
      .notice {
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        transition: background 120ms ease, opacity 120ms ease;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent);
        flex: 1;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover:not(:disabled) {
        background: #f5f2e8;
      }
      .btn-quiet {
        background: transparent;
        color: var(--muted);
        border: 1px solid transparent;
      }
      .btn-quiet:hover:not(:disabled) {
        color: var(--text);
        background: rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body>
    <!-- Non-modal bubble: one finished artifact, three actions max, zero chat input.
         Enforced by .kiro/steering/product.md and scripts/spec-check.mjs -->
    <div class="bubble" id="bubble" hidden>
      <div class="header">
        <div class="brand">
          <svg class="clip-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M16.5 6.5v8.25a4.5 4.5 0 0 1-9 0V5.75a3 3 0 0 1 6 0v8.5a1.5 1.5 0 0 1-3 0V7.5"
              stroke="#1c1917"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="10.2" cy="4.4" r="1" fill="#1d4ed8" />
            <circle cx="13.8" cy="4.4" r="1" fill="#1d4ed8" />
          </svg>
          <span class="badge" id="stuck-badge">Ready draft</span>
        </div>
        <label class="classic-pill" title="Opt-in 1997 nostalgic mode">
          <input type="checkbox" id="classic" />
          <span>'97</span>
        </label>
      </div>

      <p class="classic-banner" id="classic-banner" hidden>
        It looks like you're trying to write a document…
      </p>
      <p class="rationale" id="rationale" hidden></p>
      <div class="artifact-card" id="artifact"></div>
      <p class="degradation" id="degradation" hidden></p>
      <p class="notice" id="notice" hidden></p>

      <div class="actions">
        <button class="btn-primary" id="insert" title="Insert at cursor (Enter)">
          Insert at cursor
        </button>
        <button class="btn-secondary" id="another" title="Try another angle">
          Another version
        </button>
        <button class="btn-quiet" id="dismiss" title="Dismiss (Esc)">
          Dismiss
        </button>
      </div>
    </div>
    <script src="bubble.js"></script>
  </body>
</html>
